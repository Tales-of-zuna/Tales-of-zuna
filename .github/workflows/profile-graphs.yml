name: Profile graphs

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/profile-graphs.yml"]

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render cards
        run: node src/main.ts
        env:
          # PROFILE_TOKEN (classic PAT with repo + read:user) includes private contributions;
          # without it the built-in token only sees public activity.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Render profile graphs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
